{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ site.title }}{% endblock %}

{% block content %}
  {% if page.slug == "about" %}
  {% include "about.html" %}
  {% else %}
  <article class="page">
    <h1>{{ page.title }}</h1>
    <div class="body">{{ page.body_html | safe }}</div>
  </article>
  {% endif %}
{% endblock %}
