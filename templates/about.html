{# Included by page.html for the About page — the `pages` type has one
   template, so this is a partial rather than a standalone template. #}
<article class="page page-about">
  <h1>{{ page.title }}</h1>
  <div class="about-split">
    <img class="about-photo" src="/img/me.webp" alt="{{ site.profile.name }}">
    <div class="about-text">
      <div class="body">{{ page.body_html | safe }}</div>
    </div>
  </div>
</article>
