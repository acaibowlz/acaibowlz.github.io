<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The coder penguin from the cover illustration: a dark silhouette
       looking up at the screen, rim-lit by its green glow. -->
  <defs>
    <path id="body" d="M9 64 C9 48 14 38 19 30 C18 19 24 11 33 11
      C39 11 43 15 44 21 C45 30 49 37 52 45 C55 52 55 58 55 64 Z"/>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <clipPath id="tile">
      <rect width="64" height="64" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- purple night wall from the cover -->
    <rect width="64" height="64" fill="#2b2650"/>

    <!-- green rim light: a glowing copy nudged up, behind the body -->
    <use href="#body" transform="translate(0.6 -2)" fill="#4ad63f" filter="url(#glow)"/>
    <use href="#body" transform="translate(0.4 -1.4)" fill="#4ad63f"/>
    <use href="#body" fill="#0b0d0c"/>

    <!-- white face patch, eye and beak -->
    <path d="M38 17 C42 17 44 21 44.5 26 C45 31 47 36 48.5 40
      C44 37 40 30 38.5 24 Z" fill="#d9ddd6"/>
    <circle cx="38.5" cy="18.5" r="1.6" fill="#0b0d0c"/>
    <path d="M40.5 15.5 L54 5.5 L46 20.5 Z" fill="#f4b41a"/>
  </g>
</svg>
